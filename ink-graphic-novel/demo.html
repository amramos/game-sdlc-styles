<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ink graphic novel - demo</title>
<style>
  html, body { margin: 0; height: 100%; background: #080A10; overflow: hidden; }
  #view { position: absolute; left: 0; top: 0; }
  body.frame #view { position: fixed; left: 0; top: 0; width: 1280px; height: 720px; }
  #ui { position: fixed; left: 8px; bottom: 8px; display: flex; flex-wrap: wrap; gap: 6px;
        align-items: center; font: 14px sans-serif; color: #ECE4CE; }
  #ui button { font: 13px sans-serif; padding: 4px 8px; cursor: pointer; }
  #ui .sw { width: 14px; height: 14px; display: inline-block; outline: 1px solid #0008; }
  body.frame #ui { display: none; }
</style>
<!-- Generated art (ComfyUI), each as a data URI so the page can recolour it from file:// (see assets/README.md). -->
<script src="assets/bg-exterior.png.js"></script>
<script src="assets/bg-radio-room.png.js"></script>
<script src="assets/bg-slope.png.js"></script>
<script src="assets/rescuer-pull.png.js"></script>
<script src="assets/rescuer-flare.png.js"></script>
<script src="assets/dog.png.js"></script>
<script src="assets/dog-close.png.js"></script>
<script src="assets/sled.png.js"></script>
<script src="assets/operator.png.js"></script>
<script src="assets/radio-set.png.js"></script>
<script src="assets/thermos.png.js"></script>
<script src="assets/rope.png.js"></script>
<script src="assets/ice-axe.png.js"></script>
<script src="assets/paper-grain.png.js"></script>
</head>
<body>
<canvas id="view" width="1280" height="720"></canvas>
<div id="ui"></div>
<script>
'use strict';
// ---------------------------------------------------------------- palette roles
// Every palette fills the same eight roles and passes the colour rules in style.md. `rim` is a
// lighting choice of that palette, not of the look. The art is drawn in 'night'; the other palettes
// recolour it at load (see recolour()).
const ROLES = ['ink', 'paper', 'field-1', 'field-2', 'field-3', 'accent', 'signal-alert', 'signal-ok'];
const PALETTES = {
  night: { name: 'stark night', rim: true, 'ink': '#080A10', 'paper': '#ECE4CE', 'field-1': '#1C2A3C', 'field-2': '#3E5872', 'field-3': '#8EA9C2', 'accent': '#F4923A', 'signal-alert': '#F0607E', 'signal-ok': '#8FD3A0' },
  pulp: { name: 'pulp daytime', rim: false, 'ink': '#14100E', 'paper': '#FFF3D6', 'field-1': '#2E5D8A', 'field-2': '#58A6CC', 'field-3': '#D8EEF2', 'accent': '#FF4433', 'signal-alert': '#FFC21A', 'signal-ok': '#7FD86A' },
  noir: { name: 'grey noir', rim: true, 'ink': '#0A0A0A', 'paper': '#EEEDE6', 'field-1': '#2B2B2B', 'field-2': '#5F5F5F', 'field-3': '#ABABAB', 'accent': '#FF3D4F', 'signal-alert': '#F0C030', 'signal-ok': '#7CC8E8' },
};
let palName = 'night', P = PALETTES[palName];
let MODE = 'ink';                 // 'ink' (the look), 'sil' (silhouette test), 'dont' (rules broken)
const C = role => P[role];
const W = 1280, H = 720;
const cv = document.getElementById('view'), ctx = cv.getContext('2d');
const OVERFLOW = [];              // filled by the text layout if anything would not fit

// ---------------------------------------------------------------- small helpers
function rng(seed) {
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const rectPts = (x, y, w, h) => [[x, y], [x + w, y], [x + w, y + h], [x, y + h]];
function smooth(ctrl, seg = 5, closed = true) {          // Catmull-Rom through the control points
  const n = ctrl.length, out = [], lim = closed ? n : n - 1;
  const at = i => closed ? ctrl[(i + n) % n] : ctrl[Math.max(0, Math.min(n - 1, i))];
  for (let i = 0; i < lim; i++) {
    const p0 = at(i - 1), p1 = at(i), p2 = at(i + 1), p3 = at(i + 2);
    for (let k = 0; k < seg; k++) {
      const t = k / seg, t2 = t * t, t3 = t2 * t;
      const f = j => 0.5 * (2 * p1[j] + (-p0[j] + p2[j]) * t + (2 * p0[j] - 5 * p1[j] + 4 * p2[j] - p3[j]) * t2 + (-p0[j] + 3 * p1[j] - 3 * p2[j] + p3[j]) * t3);

    }

}
function bbox(pts) { let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9; for (const [x, y] of pts) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); } return { x0, y0, x1, y1 }; }
function path(pts) { ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]); ctx.closePath(); }
function clipTo(pts, fn) { ctx.save(); path(pts); ctx.clip(); fn(); ctx.restore(); }
function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function fillRole(pts, role) { path(pts); ctx.fillStyle = C(MODE === 'sil' ? 'ink' : role); ctx.fill(); }

// ---------------------------------------------------------------- generated art
// Every picture is ComfyUI art cleaned onto the night roles. Another palette maps each pixel by its
// luminance between the night roles (ink, field-1..3, paper) onto the same roles of that palette;
// warm, saturated pixels are the accent and map to its accent. One set of art serves every palette.
const IMG = {}, TINT = {};
function loadArt() {
  const names = Object.keys(window.ART || {});
  return Promise.all(names.map(n => new Promise(res => {
    const im = new Image(); im.onload = () => { IMG[n] = im; res(); }; im.onerror = () => res(); im.src = ART[n];
  })));
}
const lum = ([r, g, b]) => (0.3 * r + 0.55 * g + 0.15 * b) / 255;
function recolour(name) {
  const key = palName + '|' + name;
  if (TINT[key]) return TINT[key];
  const im = IMG[name]; if (!im) return null;
  const c = document.createElement('canvas'); c.width = im.width; c.height = im.height;
  const g = c.getContext('2d'); g.drawImage(im, 0, 0);
  if (palName !== 'night') {
    const src = PALETTES.night, ramp = ['ink', 'field-1', 'field-2', 'field-3', 'paper'];
    const knots = ramp.map(r => lum(hexRgb(src[r]))), to = ramp.map(r => hexRgb(P[r])), acc = hexRgb(P.accent);
    const d = g.getImageData(0, 0, c.width, c.height), px = d.data;
    for (let i = 0; i < px.length; i += 4) {
      if (!px[i + 3]) continue;
      const r = px[i], gg = px[i + 1], b = px[i + 2], L = (0.3 * r + 0.55 * gg + 0.15 * b) / 255;
      let k = 0; while (k < knots.length - 2 && L > knots[k + 1]) k++;
      const f = Math.max(0, Math.min(1, (L - knots[k]) / (knots[k + 1] - knots[k])));
      let o = [0, 1, 2].map(j => to[k][j] + (to[k + 1][j] - to[k][j]) * f);
      const warm = Math.max(0, Math.min(1, (r - b - 60) / 120)) * (r > 120 ? 1 : 0);   // the accent and its edge
      if (warm > 0) o = o.map((v, j) => v + (acc[j] - v) * warm);
      px[i] = o[0]; px[i + 1] = o[1]; px[i + 2] = o[2];
    }
    g.putImageData(d, 0, 0);
  }
  return TINT[key] = c;
}
function silhouette(name) {
  const key = 'sil|' + palName + '|' + name;
  if (TINT[key]) return TINT[key];
  const im = IMG[name]; if (!im) return null;
  const c = document.createElement('canvas'); c.width = im.width; c.height = im.height;
  const g = c.getContext('2d'); g.drawImage(im, 0, 0); g.globalCompositeOperation = 'source-in'; g.fillStyle = C('ink'); g.fillRect(0, 0, c.width, c.height);
  return TINT[key] = c;
}
// Draws art `name` with its bottom centre at (cx, by), `h` tall (or `w` wide); flip mirrors it.
function figure(name, cx, by, o = {}) {
  const src = MODE === 'sil' ? silhouette(name) : recolour(name); if (!src) return null;
  const s = o.h ? o.h / src.height : o.w / src.width, w = src.width * s, h = src.height * s;
  ctx.save(); ctx.translate(cx, by);
  if (o.flip) ctx.scale(-1, 1);
  if (MODE === 'dont') { ctx.shadowColor = 'rgba(40,40,60,0.55)'; ctx.shadowBlur = 18; ctx.shadowOffsetX = 8; ctx.shadowOffsetY = 8; ctx.filter = 'blur(0.8px) saturate(1.4)'; }
  ctx.drawImage(src, -w / 2, -h, w, h); ctx.restore();
  return { x: cx - w / 2, y: by - h, w, h };
}
// A backdrop filling a rect, cropped like CSS object-fit: cover; fx/fy pick the focus (0..1).
function backdrop(name, x, y, w, h, fx = 0.5, fy = 0.5, zoom = 1) {
  const src = recolour(name); if (!src) return;
  const s = Math.max(w / src.width, h / src.height) * zoom, sw = w / s, sh = h / s;
  const sx = (src.width - sw) * fx, sy = (src.height - sh) * fy;
  ctx.save();
  if (MODE === 'dont') ctx.filter = 'blur(1.6px) saturate(1.7) brightness(1.15)';
  if (MODE === 'sil') { ctx.fillStyle = C('paper'); ctx.fillRect(x, y, w, h); }
  else ctx.drawImage(src, sx, sy, sw, sh, x, y, w, h);
  ctx.restore();
  if (MODE === 'dont') { const g = ctx.createLinearGradient(0, y, 0, y + h); g.addColorStop(0, 'rgba(120,60,160,0.35)'); g.addColorStop(1, 'rgba(255,150,80,0.35)'); ctx.fillStyle = g; ctx.fillRect(x, y, w, h); }
}
// A cast shadow: a flat ink shape on the ground, skewed down and away from the light.
function castShadow(cx, by, w, skew = 46, depth = 14) {
  if (MODE === 'dont') { ctx.save(); ctx.fillStyle = 'rgba(30,30,40,0.25)'; ctx.filter = 'blur(10px)'; ctx.beginPath(); ctx.ellipse(cx + 10, by + 4, w / 2, 9, 0, 0, 7); ctx.fill(); ctx.restore(); return; }
  fillRole([[cx - w / 2, by - 3], [cx + w / 2, by - 3], [cx + w / 2 + skew, by + depth], [cx - w / 2 + skew * 0.6, by + depth + 2]], 'ink');
}

// ---------------------------------------------------------------- paper
// The page, captions, slips and notes are one paper: the paper role with a faint multiplied grain
// (a tileable greyscale texture; white leaves the colour as it is).
let GRAIN = null;
function grain(x, y, w, h, pts) {
  if (MODE !== 'ink' || !IMG['paper-grain']) return;
  if (!GRAIN) GRAIN = ctx.createPattern(IMG['paper-grain'], 'repeat');
  ctx.save(); if (pts) { path(pts); ctx.clip(); }
  ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = GRAIN; ctx.fillRect(x, y, w, h); ctx.restore();
}
function paperRect(x, y, w, h) { ctx.fillStyle = C('paper'); ctx.fillRect(x, y, w, h); grain(x, y, w, h); }

// ---------------------------------------------------------------- ink strokes (UI marks, rope)
function strokeVar(pts, ws, closed, col) {
  ctx.fillStyle = col;
  const n = pts.length, segs = closed ? n : n - 1;
  for (let i = 0; i < segs; i++) {
    const a = pts[i], b = pts[(i + 1) % n], dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 1;
    const nx = -dy / L, ny = dx / L, wa = ws[i] / 2, wb = ws[(i + 1) % n] / 2;
    ctx.beginPath(); ctx.moveTo(a[0] + nx * wa, a[1] + ny * wa); ctx.lineTo(b[0] + nx * wb, b[1] + ny * wb);
    ctx.lineTo(b[0] - nx * wb, b[1] - ny * wb); ctx.lineTo(a[0] - nx * wa, a[1] - ny * wa); ctx.closePath(); ctx.fill();
  }
  for (let i = 0; i < n; i++) if (ws[i] > 0.6) { ctx.beginPath(); ctx.arc(pts[i][0], pts[i][1], ws[i] / 2, 0, Math.PI * 2); ctx.fill(); }
}
// An open brush stroke, tapered at both ends.
function brush(pts, w, role = 'ink') {
  if (MODE === 'dont') { ctx.beginPath(); ctx.moveTo(...pts[0]); pts.slice(1).forEach(p => ctx.lineTo(...p)); ctx.lineWidth = 1.5; ctx.strokeStyle = '#777c86'; ctx.stroke(); return; }
  const fine = smooth(pts, 6, false), n = fine.length;
  strokeVar(fine, fine.map((_, i) => w * Math.pow(Math.sin(Math.PI * (0.1 + 0.8 * i / (n - 1))), 0.5)), false, C(MODE === 'sil' ? 'ink' : role));
}
function hatch(pts, spacing = 8, angle = -0.85, w = 2) {
  if (MODE !== 'ink') return;
  clipTo(pts, () => {
    const b = bbox(pts), cx = (b.x0 + b.x1) / 2, cy = (b.y0 + b.y1) / 2, R = Math.hypot(b.x1 - b.x0, b.y1 - b.y0) / 2 + 4;
    const ca = Math.cos(angle), sa = Math.sin(angle);
    ctx.beginPath();
    for (let d = -R; d <= R; d += spacing) { ctx.moveTo(cx - ca * R - sa * d, cy - sa * R + ca * d); ctx.lineTo(cx + ca * R - sa * d, cy + sa * R + ca * d); }
    ctx.lineWidth = w; ctx.strokeStyle = C('ink'); ctx.stroke();
  });
}
function flakes(x0, y0, w, h, n, seed, t) {
  const r = rng(seed);
  for (let i = 0; i < n; i++) {
    const x = x0 + (r() * w + t * (6 + r() * 6)) % w, y = y0 + (r() * h + t * (14 + r() * 10)) % h, s = 1.5 + r() * 2.5;
    if (MODE === 'dont') { ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.beginPath(); ctx.arc(x, y, s * 2.2, 0, 7); ctx.fill(); continue; }
    if (MODE === 'sil') continue;
    ctx.fillStyle = C('paper'); ctx.beginPath(); ctx.arc(x, y, s, 0, 7); ctx.fill();
  }
}
function glow(x, y, r, col) {              // used only by the 'dont' frame
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, col); g.addColorStop(1, 'rgba(255,160,60,0)');
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, 2 * r, 2 * r);
}

// ---------------------------------------------------------------- lettering
const LET = '"Comic Neue","Comic Sans MS","Chalkboard SE","Segoe Print",cursive';
const TIT = '"IM Fell English SC",Georgia,"Times New Roman",serif';
const font = (px, kind = 'let') => MODE === 'dont' ? `${Math.round(px * 0.62)}px Arial,sans-serif`
  : kind === 'tit' ? `small-caps 700 ${px}px ${TIT}` : `700 ${px}px ${LET}`;
function wrap(text, f, maxW) {
  ctx.font = f;
  const out = [];
  for (const para of text.split('\n')) {
    let cur = '';
    for (let word of para.split(/\s+/).filter(Boolean)) {
      while (ctx.measureText(word).width > maxW && word.length > 1) {      // a word wider than the box
        let k = word.length - 1; while (k > 1 && ctx.measureText(word.slice(0, k)).width > maxW) k--;
        if (cur) { out.push(cur); cur = ''; } out.push(word.slice(0, k)); word = word.slice(k);
      }
      const tryS = cur ? cur + ' ' + word : word;
      if (!cur || ctx.measureText(tryS).width <= maxW) cur = tryS; else { out.push(cur); cur = word; }
    }

}
function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
// The narration frame: a lettered paper box with an ink border and a hard offset shadow.
// dark = ink box with paper letters (a log). Returns the height.
function caption(x, y, w, text, o = {}) {
  const fs = o.fs || 20, pad = o.pad ?? 10, lh = Math.round(fs * 1.22);
  const f = font(fs, o.title ? 'tit' : 'let');
  const lines = wrap(o.title || o.lower ? text : text.toUpperCase(), f, w - pad * 2);
  const h = Math.max(o.h || 0, lines.length * lh + pad * 2);
  if (o.measure) return h;
  const dark = o.dark, fg = dark ? C('paper') : C('ink');
  if (MODE === 'dont') {
    ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.4)'; ctx.shadowBlur = 16;
    ctx.fillStyle = dark ? '#ff9a3c' : 'rgba(30,34,44,0.55)'; roundRect(x, y, w, h, 12); ctx.fill(); ctx.restore();
    ctx.fillStyle = '#ffffff';
  } else {
    ctx.fillStyle = C('ink'); ctx.fillRect(x + 5, y + 5, w, h);
    if (dark) { ctx.fillStyle = C('ink'); ctx.fillRect(x, y, w, h); } else paperRect(x, y, w, h);
    ctx.lineWidth = 3; ctx.strokeStyle = dark ? C('paper') : C('ink');

}
// The bare label: title lettering straight on the page, no box.
function label(x, y, text, fs = 30) {
  ctx.font = font(fs, 'tit'); ctx.textBaseline = 'top'; ctx.fillStyle = MODE === 'dont' ? '#ffffff' : C('ink'); ctx.fillText(text, x, y);

  const lh = Math.round(fs * 1.22), f = font(fs), lines = wrap(text.toUpperCase(), f, w - 24), h = lines.length * lh + 18;
  if (MODE === 'dont') { ctx.fillStyle = 'rgba(255,255,255,0.8)'; roundRect(x, y, w, h, 14); ctx.fill(); ctx.fillStyle = '#333'; }
  else {
    ctx.beginPath(); ctx.moveTo(x + w * 0.62, y + h - 2); ctx.lineTo(tail[0], tail[1]); ctx.lineTo(x + w * 0.78, y + h - 2); ctx.closePath();

    roundRect(x, y, w, h, h / 2.4); ctx.fillStyle = C('paper'); ctx.fill(); ctx.lineWidth = 3; ctx.stroke();

// A sound word: big serif letters, an ink stroke under a paper fill and a hard ink offset.
function sfx(text, xRight, y, fs, rot) {
  ctx.save(); ctx.font = font(fs, 'tit'); ctx.textBaseline = 'top';
  const w = ctx.measureText(text).width; ctx.translate(xRight - w, y); ctx.rotate(rot);

// A handwritten note on ruled paper, pinned at an angle. Returns the height (before rotation).
function note(x, y, w, text, rot, fs = 20, measure = false) {
  const lh = Math.round(fs * 1.3), f = MODE === 'dont' ? font(fs) : `400 ${fs}px ${LET}`, lines = wrap(text, f, w - 28), h = lines.length * lh + 38;   // 24 px top margin holds the pin

}
// A torn scrap of paper: straight-ish long edges, ragged short edges.
function tornRect(w, h, seed) {
  const r = rng(seed), pts = [];
  for (let x = 0; x < w; x += 18) pts.push([x, (r() - 0.5) * 2]);
  for (let y = 0; y < h; y += 3) pts.push([w - 2 + (r() - 0.5) * 3 + Math.sin(y * 0.45) * 1.2, y]);   // the torn end: fine fibres
  for (let x = w; x > 0; x -= 18) pts.push([x, h + (r() - 0.5) * 2]);

}
// An answer slip: a scrap of paper with its key in an ink disc and the answer in capitals.
// focus lifts it (moves up, longer shadow); off drains it (no shadow, field border, reason below).
// Returns the height of the slip before rotation.
function slip(x, y, w, text, o = {}) {
  const fs = o.fs || 20, lh = Math.round(fs * 1.2), padL = 46, f = font(fs), small = Math.max(16, fs - 4);
  const lines = wrap(text.toUpperCase(), f, w - padL - 14), reason = o.reason ? wrap(o.reason, `400 ${small}px ${LET}`, w - padL - 14) : [];
  const h = Math.max(o.h || 0, lines.length * lh + reason.length * Math.round(small * 1.2) + 26);
  if (o.measure) return h;
  if (MODE === 'dont') {
    ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.4)'; ctx.shadowBlur = 16;
    ctx.fillStyle = o.focus ? '#ff9a3c' : 'rgba(30,34,44,0.55)'; roundRect(x, y, w, h, 12); ctx.fill(); ctx.restore();
    ctx.fillStyle = '#fff'; ctx.font = font(fs); ctx.textBaseline = 'top';
    lines.forEach((l, i) => ctx.fillText(`[${o.key}] ` + l, x + 12, y + 12 + i * lh));
    return h;

  // idle: at most 10 fps (falling snow), paused while the tab is hidden
  const step = () => { t += 0.1; if (view === 'key-scene') render(); };
  const run = () => { if (!timer) timer = setInterval(step, 100); };
  const stop = () => { clearInterval(timer); timer = null; };
  document.addEventListener('visibilitychange', () => (document.hidden ? stop() : run()));
  addEventListener('resize', fit);
  fit(); drawUi(); render(); run();
}
if (typeof document !== 'undefined' && !window.__NO_BOOT) boot();
</script>
</body>
